<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>角色列表查询</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" href="/static/layuiadmin/layui/css/layui.css" media="all">
  <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" href="/static/layuiadmin/style/admin.css" media="all">
  <style>
    .layui-table-cell .layui-form-checkbox[lay-skin="primary"] {
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
<div class="layui-fluid">
  <div class="layui-card">
    <div class="layui-card-body layui-form">
      <table id="LAY-app-content-list" lay-filter="LAY-app-content-list" class="layui-hide">
      </table>

      <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
          <button th:if="${session.user2.roleId==1}" class="layui-btn layuiadmin-btn-list layui-btn-danger"
                  lay-event="batchdel">批量删除</button>
          <button class="layui-btn layuiadmin-btn-list" lay-event="add">添加</button>
        </div>
      </script>

      <script type="text/html" id="table-content-list">
        <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
        <a th:if="${session.user2.roleId==1}" class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
      </script>

    </div>
  </div>
</div>

<script th:src="@{/layuiadmin/layui/layui.js}" src="/static/layuiadmin/layui/layui.js"></script>
<script type="text/javascript">
  layui.config({
    base: '/layuiadmin/'
  }).extend({
    index: 'lib/index'
  }).use(['index', 'table'], function(){
    var table = layui.table
            ,form = layui.form
            ,layer = layui.layer
            ,$ = layui.jquery;

    layer.ready(function (){
      tableRender(table);
    });

    table.on('toolbar(LAY-app-content-list)', function(obj){
      if(obj.event == 'batchdel') {
        var checkStatus = table.checkStatus('LAY-app-content-list'), data = checkStatus.data;
        var delList=[];
        data.forEach(function(n,i){
          delList.push(n.rid);
        });
        layer.confirm('确认要删除被选中的记录吗？', {
          btn : [ '确定', '取消' ]
        }, function(index) {
          $.ajax({
            type: 'post',
            url: '/role/batchDel',
            data: { roleIds: delList },
            success: function(data){
              if(data.code == '0'){
                tableRender(layui.table);
                layer.msg('批量删除成功', { time: 1000 });
              }else {
                layer.msg('批量删除失败', { time: 1000 });
              }
            }
          });
        });
      } else if(obj.event == 'add') {
        layer.open({
          type: 2
          ,title: '添加角色'
          ,area: ['400px','250px']
          ,shade: 0.8
          ,id: 'LAY_layuipro'
          ,btn: []
          ,btnAlign: 'c'
          ,moveType: 1
          ,content: '/role/toAdd'
        });
      }
    });

    table.on('tool(LAY-app-content-list)', function(obj){
      if(obj.event == 'edit') {
        layer.open({
          type: 2
          ,title: '修改角色'
          ,area: ['400px','250px']
          ,shade: 0.8
          ,id: 'LAY_layuipro'
          ,btn: []
          ,btnAlign: 'c'
          ,moveType: 1
          ,content: '/role/toEdit/' + obj.data.rid
        });
      } else if(obj.event == 'del') {
        layer.confirm('确认要删除吗？', {
          btn : [ '确定', '取消' ]
        }, function(index) {
          $.ajax({
            type: 'post',
            url: '/role/doDel/' + obj.data.rid,
            data: {},
            success: function(data){
              if(data.code == '0'){
                tableRender(layui.table);
                layer.msg('删除成功', { time: 1000 });
              }else {
                layer.msg('删除失败', { time: 1000 });
              }
            }
          });
        });
      }
    });
  });

  function tableRender(table) {
    table.render({
      elem: '#LAY-app-content-list'
      ,url: '/role/getAllForTable'
      ,page: true
      ,limits: [5,10,20]
      ,limit: 10
      ,layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip']
      ,method: 'post'
      ,request: {pageName: 'page', limitName: 'limit'}
      ,toolbar: '#toolbarDemo'
      ,cellMinWidth: 80
      ,defaultToolbar: ['filter', 'exports', 'print', {
        title: '提示', layEvent: 'LAYTABLE_TIPS', icon: 'layui-icon-tips'
      }]
      ,title: '角色列表'
      ,cols: [ [ {type:'checkbox'}
        ,{field:'rid', title:'角色编号', width:150, sort:'true'}
        ,{field:'roleName', title:'角色名称', width:300}
        ,{fixed: 'right', title:'操作', toolbar: '#table-content-list', width:150}
      ] ]
    });
  }
</script>
</body>
</html>
