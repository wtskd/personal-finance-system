<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>交易记录列表</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" href="/static/layuiadmin/layui/css/layui.css" media="all">
  <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" href="/static/layuiadmin/style/admin.css" media="all">
  <style>
    .layui-table-cell .layui-form-checkbox[lay-skin="primary"] {
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
<div class="layui-fluid">
  <div class="layui-card">
    <div id="xxx" class="layui-form layui-card-header layuiadmin-card-header-auto">
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">交易类型：</label>
          <div class="layui-input-inline">
            <select id="search_status">
              <option value="">全部</option>
              <option value="收入">收入</option>
              <option value="支出">支出</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">账户ID：</label>
          <div class="layui-input-inline">
            <input type="text" id="search_accountId" placeholder="请输入账户ID" autocomplete="off"
                   class="layui-input"/>
          </div>
        </div>
        <div class="layui-inline">
          <button id="search-submit" class="layui-btn layuiadmin-btn-list"
                  lay-filter="LAY-app-contlist-search">
            <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i>查询
          </button>
        </div>
      </div>
    </div>

    <div class="layui-card-body layui-form">
      <table id="LAY-app-content-list" lay-filter="LAY-app-content-list" class="layui-hide">
      </table>
      <!--工具栏-->
      <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
          <button th:if="${session.user2.roleId==1}" class="layui-btn layuiadmin-btn-list layui-btn-danger"
                  lay-event="batchdel">批量删除</button>
          <button class="layui-btn layuiadmin-btn-list" lay-event="add">添加</button>
        </div>
      </script>

      <!--表格右侧的操作列-->
      <script type="text/html" id="table-content-list">
        <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
        <a th:if="${session.user2.roleId==1}" class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
      </script>

    </div>
  </div>
</div>

<script th:src="@{/layuiadmin/layui/layui.js}" src="/static/layuiadmin/layui/layui.js"></script>
<script type="text/javascript">
  layui.config({
    base: '/layuiadmin/'
  }).extend({
    index: 'lib/index'
  }).use(['index', 'table'], function(){
    var table = layui.table
            ,form = layui.form
            ,layer = layui.layer
            ,laypage = layui.laypage
            ,$ = layui.jquery;

    layer.ready(function (){
      tableRender(table, { status: '', accountIdStr: ''});
    });

    //监听行外左侧工具条按钮
    table.on('toolbar(LAY-app-content-list)', function(obj){
      if(obj.event == 'batchdel') {
        var checkStatus = table.checkStatus('LAY-app-content-list'), data = checkStatus.data;
        var delList=[];
        data.forEach(function(n,i){
          delList.push(n.transactionId);
        });
        console.log(delList);
        layer.confirm('确认要删除被选中的记录吗？', {
          btn : [ '确定', '取消' ]
        }, function(index) {
          $.ajax({
            type: 'post',
            url: '/transaction/batchDel',
            data: {
              transactionIds: delList
            },
            success: function(data){
              console.log(data);
              if(data.code == '0'){
                var param_search = {
                  status: $("#search_status").val(),
                  accountIdStr: $("#search_accountId").val()
                };
                tableRender(layui.table, param_search);
                layer.msg('批量删除成功', {
                  time: 1000,
                });
              }else {
                layer.msg('批量删除失败', {
                  time: 1000,
                });
              }
            }
          });
        });
      } else if(obj.event == 'add') {
        layer.open({
          type: 2
          ,title: '添加交易记录'
          ,area: ['450px','400px']
          ,shade: 0.8
          ,id: 'LAY_layuipro'
          ,btn: []
          ,btnAlign: 'c'
          ,moveType: 1
          ,content: '/transaction/toAdd'
          ,success: function(layero){
            console.log('完成新增');
          }
        });
      }
    });

    //监听行内操作列按钮
    table.on('tool(LAY-app-content-list)', function(obj){
      if(obj.event == 'edit') {
        console.log("edit for:" + obj.data.transactionId);
        layer.open({
          type: 2
          ,title: '修改交易记录'
          ,area: ['450px','400px']
          ,shade: 0.8
          ,id: 'LAY_layuipro'
          ,btn: []
          ,btnAlign: 'c'
          ,moveType: 1
          ,content: '/transaction/toEdit/' + obj.data.transactionId
          ,success: function(layero){
            console.log('完成修改');
          }
        });
      } else if(obj.event == 'del') {
        console.log("del for:" + obj.data.transactionId);
        layer.confirm('确认要删除吗？', {
          btn : [ '确定', '取消' ]
        }, function(index) {
          $.ajax({
            type: 'post',
            url: '/transaction/doDel/' + obj.data.transactionId,
            data: {},
            success: function(data){
              console.log(data);
              if(data.code == '0'){
                var param_search = {
                  status: $("#search_status").val(),
                  accountIdStr: $("#search_accountId").val()
                };
                tableRender(layui.table, param_search);
                layer.msg('删除成功', {
                  time: 1000,
                });
              }else {
                layer.msg('删除失败', {
                  time: 1000,
                });
              }
            }
          });
        });
      }
    });

    $("#search-submit").on("click", function (){
      console.log("do search-submit.");
      var param_search = {
        status: $("#search_status").val(),
        accountIdStr: $("#search_accountId").val()
      };
      tableRender(layui.table, param_search);
      return false;
    });
  });

  function tableRender(table, param_search) {
    console.log("param_search=" + param_search);
    table.render({
      elem: '#LAY-app-content-list'
      ,url: '/transaction/getPage'
      ,where: param_search
      ,page: true
      ,limits: [2,5,10,20,50]
      ,limit: 5
      ,layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip']
      ,method: 'post'
      ,request: {pageName: 'page', limitName: 'limit'}
      ,toolbar: '#toolbarDemo'
      ,cellMinWidth: 80
      ,defaultToolbar: ['filter', 'exports', 'print', {
        title: '提示'
        ,layEvent: 'LAYTABLE_TIPS'
        ,icon: 'layui-icon-tips'
      }]
      ,title: '交易记录表'
      ,cols: [ [ {type:'checkbox'}
        ,{field:'transactionId', title:'交易编号', width:100, sort:'true'}
        ,{field:'amount', title:'金额', width:120}
        ,{field:'status', title:'类型', width:80,
          templet: function(d){
            if(d.status == '收入'){
              return '<span style="color:green;">收入</span>';
            }else{
              return '<span style="color:red;">支出</span>';
            }
          }
        }
        ,{field:'accountId', title:'所属账户', width:150,
          templet: function(d){
            if(d.financeAccount){
              return d.financeAccount.accountName;
            }
            return d.accountId;
          }
        }
        ,{field:'categoryName', title:'收支分类', width:120}
        ,{field:'createTime', title:'交易时间', width:170,
          templet: function(d){
            if(d.createTime){
              return new Date(d.createTime).toLocaleString();
            }
            return '';
          }
        }
        ,{fixed: 'right', title:'操作', toolbar: '#table-content-list', width:150}
      ] ]
    });
  }
</script>
</body>
</html>
