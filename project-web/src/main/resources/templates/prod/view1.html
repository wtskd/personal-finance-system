<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>财务月度分析</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" href="/static/layuiadmin/layui/css/layui.css" media="all">
    <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" href="/static/layuiadmin/style/admin.css" media="all">
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div id="xxx" class="layui-form layui-card-header layuiadmin-card-header-auto">
            <div class="layui-form-item">
                <h3 th:text="${echartTitle}">财务月度分析</h3>
            </div>
        </div>
        <input id="echarts_title" type="hidden" th:value="${echartTitle}">
        <input id="echarts_xAxis" type="hidden" th:value="${echartXAxis}">
        <input id="echarts_income" type="hidden" th:value="${echartIncome}">
        <input id="echarts_expense" type="hidden" th:value="${echartExpense}">

        <div class="layui-card-body layui-form">
            <div id="echartMain" style="width: 900px;height:500px;"></div>
        </div>
    </div>
</div>

<script src="/static/layuiadmin/layui/layui.js" th:src="@{/layuiadmin/layui/layui.js}"></script>
<script src="/static/jquery-3.5.1.min.js" th:src="@{/jquery-3.5.1.min.js}"></script>
<script src="/static/js/echarts.min.js" th:src="@{/js/echarts.min.js}"></script>
<script type="text/javascript">
    var myChart = echarts.init(document.getElementById('echartMain'));
    var echarts_title = $("#echarts_title").val();
    var echarts_xAxis = JSON.parse($("#echarts_xAxis").val() || '[]');
    var echarts_income = JSON.parse($("#echarts_income").val() || '[]');
    var echarts_expense = JSON.parse($("#echarts_expense").val() || '[]');

    console.log("xAxis=" + echarts_xAxis);
    console.log("income=" + echarts_income);
    console.log("expense=" + echarts_expense);

    var option = {
        title: {
            text: echarts_title
        },
        tooltip: {},
        legend: {
            data: ['收入', '支出']
        },
        xAxis: {
            data: echarts_xAxis
        },
        yAxis: {},
        series: [{
            name: '收入',
            type: 'line',
            data: echarts_income,
            itemStyle: { color: '#67C23A' }
        }, {
            name: '支出',
            type: 'line',
            data: echarts_expense,
            itemStyle: { color: '#F56C6C' }
        }]
    };

    myChart.setOption(option);
</script>
</body>
</html>
