<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>财务占比分析</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" href="/static/layuiadmin/layui/css/layui.css" media="all">
    <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" href="/static/layuiadmin/style/admin.css" media="all">
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div id="xxx" class="layui-form layui-card-header layuiadmin-card-header-auto">
            <div class="layui-form-item">
                <h3 th:text="${echartTitle}">财务占比分析</h3>
            </div>
        </div>
        <input id="echarts_title" type="hidden" th:value="${echartTitle}">
        <input id="echarts_name" type="hidden" th:value="${echartName}">
        <input id="echarts_data" type="hidden" th:value="${echartData}">

        <div class="layui-card-body layui-form">
            <div id="echartMain" style="width: 800px;height:500px;"></div>
        </div>
    </div>
</div>

<script src="/static/layuiadmin/layui/layui.js" th:src="@{/layuiadmin/layui/layui.js}"></script>
<script src="/static/jquery-3.5.1.min.js" th:src="@{/jquery-3.5.1.min.js}"></script>
<script src="/static/js/echarts.min.js" th:src="@{/js/echarts.min.js}"></script>
<script type="text/javascript">
    var myChart = echarts.init(document.getElementById('echartMain'));
    var echarts_title = $("#echarts_title").val();

    var rawData = JSON.parse($("#echarts_data").val() || '[]');

    var pieData = [];
    for (var i = 0; i < rawData.length; i++) {
        pieData.push({
            value: rawData[i].value || 0,
            name: rawData[i].name || '未知'
        });
    }

    console.log("pieData=", pieData);

    var option = {
        title: {
            text: echarts_title,
            left: 'center'
        },
        tooltip: {
            trigger: 'item',
            formatter: '{b}: {c} ({d}%)'
        },
        color: ['#67C23A', '#409EFF', '#E6A23C', '#F56C6C', '#909399', '#B37FEB', '#36CFC9', '#F2A6B0', '#79BBFF'],
        legend: {
            orient: 'vertical',
            left: 'left'
        },
        series: [{
            name: '支出占比',
            type: 'pie',
            radius: '55%',
            data: pieData,
            emphasis: {
                itemStyle: {
                    shadowBlur: 10,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                }
            }
        }]
    };

    myChart.setOption(option);
</script>
</body>
</html>
